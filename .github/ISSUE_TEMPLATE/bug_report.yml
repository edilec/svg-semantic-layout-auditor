name: Bug report
description: Report a reproducible incorrect result or CLI failure.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private SVGs, credentials, customer data, or security vulnerabilities. Use SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or a commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic SVG and command
      description: Provide an SVG you created specifically for this report and the exact command.
      render: shell
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: node
    attributes:
      label: Node.js version
      options:
        - Node.js 20
        - Node.js 22
        - Node.js 24
        - Other supported or newer version
    validations:
      required: true
