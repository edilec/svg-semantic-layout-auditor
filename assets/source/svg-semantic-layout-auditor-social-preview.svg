<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="ssla-title ssla-description">
  <title id="ssla-title">SVG Semantic Layout Auditor repository preview</title>
  <desc id="ssla-description">An Edilec open-source card showing an SVG canvas with semantic metadata, reference, and layout checks.</desc>
  <defs>
    <linearGradient id="ssla-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090D0C"/>
      <stop offset="1" stop-color="#111915"/>
    </linearGradient>
    <linearGradient id="ssla-emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A7F3C4"/>
      <stop offset="1" stop-color="#58C98A"/>
    </linearGradient>
    <pattern id="ssla-grid" width="44" height="44" patternUnits="userSpaceOnUse">
